<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Schema della Digital Balanced Scorecard: quattro prospettive collegate a variabili digitali trasversali">
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="1000" height="440" rx="24"/></clipPath>
  </defs>
  <style>
    .f { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .h  { font-size: 17px; font-weight: 800; }
    .k  { font-size: 13.5px; font-weight: 500; fill: #CBD5E1; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite }
    .rev  { animation-direction: reverse }
    @keyframes flow { to { stroke-dashoffset: -28 } }
    .ring  { transform-origin: 500px 220px; animation: spin 18s linear infinite }
    .ring2 { transform-origin: 500px 220px; animation: spin 26s linear infinite reverse }
    @keyframes spin { to { transform: rotate(360deg) } }
    .core { transform-origin: 500px 220px; animation: beat 3s ease-in-out infinite }
    @keyframes beat { 50% { transform: scale(1.06) } }
    .box { opacity: 0; animation: pop .7s cubic-bezier(.2,.8,.2,1.2) forwards }
    .b1 { animation-delay: .2s } .b2 { animation-delay: .45s } .b3 { animation-delay: .7s } .b4 { animation-delay: .95s }
    @keyframes pop { from { opacity: 0; transform: scale(.92) } to { opacity: 1; transform: none } }
    .box { transform-box: fill-box; transform-origin: center }
  </style>
  <g clip-path="url(#card)">
    <rect width="1000" height="440" fill="#0D1220"/>

    <!-- connessioni animate -->
    <g fill="none" stroke-width="2">
      <path class="flow"     d="M330 110 C 420 110, 430 170, 452 190" stroke="#8B5CF6"/>
      <path class="flow rev" d="M670 110 C 580 110, 570 170, 548 190" stroke="#EC4899"/>
      <path class="flow"     d="M330 330 C 420 330, 430 270, 452 250" stroke="#06B6D4"/>
      <path class="flow rev" d="M670 330 C 580 330, 570 270, 548 250" stroke="#34D399"/>
    </g>

    <!-- nucleo -->
    <g class="ring"><circle cx="500" cy="220" r="92" fill="none" stroke="#8B5CF6" stroke-opacity=".5" stroke-dasharray="3 9"/></g>
    <g class="ring2"><circle cx="500" cy="220" r="108" fill="none" stroke="#22D3EE" stroke-opacity=".3" stroke-dasharray="1 6"/>
      <circle cx="608" cy="220" r="4" fill="#22D3EE"/><circle cx="392" cy="220" r="4" fill="#A78BFA"/></g>
    <g class="core">
      <circle cx="500" cy="220" r="70" fill="url(#core)" filter="url(#glow)"/>
      <text x="500" y="212" text-anchor="middle" class="f" font-size="20" font-weight="800" fill="#FFFFFF">Digital</text>
      <text x="500" y="236" text-anchor="middle" class="f" font-size="20" font-weight="800" fill="#FFFFFF">BSC</text>
      <text x="500" y="256" text-anchor="middle" class="f" font-size="11" font-weight="600" fill="#E0E7FF">variabili digitali trasversali</text>
    </g>

    <!-- prospettive -->
    <g class="box b1">
      <rect x="40" y="40" width="290" height="140" rx="18" fill="#8B5CF6" fill-opacity=".1" stroke="#8B5CF6" stroke-opacity=".7"/>
      <text x="64" y="76" class="f h" fill="#C4B5FD">💰 Financial</text>
      <text x="64" y="106" class="f k">• ROI, ROS, EBITDA</text>
      <text x="64" y="128" class="f k">• Capitale circolante</text>
      <text x="64" y="150" class="f k">• Ritorno degli investimenti digitali</text>
    </g>
    <g class="box b2">
      <rect x="670" y="40" width="290" height="140" rx="18" fill="#EC4899" fill-opacity=".1" stroke="#EC4899" stroke-opacity=".7"/>
      <text x="694" y="76" class="f h" fill="#F9A8D4">🤝 Customer</text>
      <text x="694" y="106" class="f k">• Customer satisfaction</text>
      <text x="694" y="128" class="f k">• Touchpoint digitali B2B</text>
      <text x="694" y="150" class="f k">• E-commerce analytics</text>
    </g>
    <g class="box b3">
      <rect x="40" y="260" width="290" height="140" rx="18" fill="#06B6D4" fill-opacity=".1" stroke="#06B6D4" stroke-opacity=".7"/>
      <text x="64" y="296" class="f h" fill="#67E8F9">⚙️ Internal Processes</text>
      <text x="64" y="326" class="f k">• Efficienza operativa digitale</text>
      <text x="64" y="348" class="f k">• Automazione dei processi</text>
      <text x="64" y="370" class="f k">• Volumi e tempi di produzione</text>
    </g>
    <g class="box b4">
      <rect x="670" y="260" width="290" height="140" rx="18" fill="#34D399" fill-opacity=".09" stroke="#34D399" stroke-opacity=".7"/>
      <text x="694" y="296" class="f h" fill="#6EE7B7">🌱 Learning &amp; Growth</text>
      <text x="694" y="326" class="f k">• Competenze digitali</text>
      <text x="694" y="348" class="f k">• Adozione degli strumenti</text>
      <text x="694" y="370" class="f k">• Data governance</text>
    </g>
  </g>
</svg>
