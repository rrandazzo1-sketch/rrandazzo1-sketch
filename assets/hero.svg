<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Riccardo Randazzo — Project Manager, Marketing Analyst, AI Implementation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="1" stop-color="#131A2B"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F472B6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="1000" height="280" rx="26"/></clipPath>
  </defs>
  <style>
    .f   { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 5px; fill: #22D3EE; }
    .name    { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; }
    .role    { font-size: 20px; font-weight: 500; fill: #CBD5E1; }
    .pill    { font-size: 13px; font-weight: 600; fill: #E2E8F0; }
    .in  { opacity: 0; animation: in 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .35s } .d3 { animation-delay: .55s } .d4 { animation-delay: .75s }
    @keyframes in { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .b1 { animation: m1 14s ease-in-out infinite } .b2 { animation: m2 17s ease-in-out infinite } .b3 { animation: m3 11s ease-in-out infinite }
    @keyframes m1 { 50% { transform: translate(140px, 50px) } }
    @keyframes m2 { 50% { transform: translate(-160px, -40px) } }
    @keyframes m3 { 50% { transform: translate(60px, 90px) } }
    .spin  { transform-origin: 830px 140px; animation: spin 22s linear infinite }
    .spinr { transform-origin: 830px 140px; animation: spin 14s linear infinite reverse }
    @keyframes spin { to { transform: rotate(360deg) } }
    .core { transform-origin: 830px 140px; animation: beat 2.4s ease-in-out infinite }
    @keyframes beat { 50% { transform: scale(1.12) } }
    .dot { animation: blink 1.6s ease-in-out infinite }
    @keyframes blink { 50% { opacity: .25 } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <g filter="url(#blur)" opacity="0.55">
      <circle class="b1" cx="160" cy="40"  r="120" fill="#8B5CF6"/>
      <circle class="b2" cx="860" cy="250" r="130" fill="#06B6D4"/>
      <circle class="b3" cx="520" cy="-30" r="80"  fill="#EC4899"/>
    </g>

    <!-- rete neurale orbitante -->
    <g opacity="0.95">
      <g class="spin">
        <circle cx="830" cy="140" r="96" fill="none" stroke="#8B5CF6" stroke-opacity=".45" stroke-dasharray="4 10"/>
        <circle cx="926" cy="140" r="6" fill="#A78BFA" filter="url(#glow)"/>
        <circle cx="734" cy="140" r="4" fill="#A78BFA"/>
        <circle cx="830" cy="44"  r="5" fill="#F472B6" filter="url(#glow)"/>
      </g>
      <g class="spinr">
        <circle cx="830" cy="140" r="62" fill="none" stroke="#22D3EE" stroke-opacity=".5" stroke-dasharray="2 7"/>
        <circle cx="830" cy="202" r="5" fill="#22D3EE" filter="url(#glow)"/>
        <circle cx="868" cy="91"  r="4" fill="#22D3EE"/>
        <line x1="830" y1="140" x2="830" y2="202" stroke="#22D3EE" stroke-opacity=".35"/>
        <line x1="830" y1="140" x2="868" y2="91"  stroke="#22D3EE" stroke-opacity=".35"/>
      </g>
      <g class="core">
        <circle cx="830" cy="140" r="26" fill="url(#shine)" filter="url(#glow)"/>
        <text x="830" y="147" text-anchor="middle" class="f" font-size="19" font-weight="800" fill="#0B0F1A">AI</text>
      </g>
    </g>

    <text x="60" y="78"  class="f eyebrow in d1">CIAO, SONO</text>
    <text x="56" y="148" class="f name in d2" fill="url(#shine)">Riccardo Randazzo</text>
    <text x="60" y="188" class="f role in d3">Project Manager · Marketing Analyst · AI Implementation</text>

    <g class="in d4">
      <rect x="60" y="210" width="188" height="32" rx="16" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".12"/>
      <circle class="dot" cx="80" cy="226" r="5" fill="#34D399"/>
      <text x="94" y="231" class="f pill">Business × AI × Data</text>
      <rect x="260" y="210" width="210" height="32" rx="16" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="280" y="231" class="f pill">🎓 LM-77 · Università LUMSA</text>
    </g>
  </g>
  <rect x="1" y="1" width="998" height="278" rx="25" fill="none" stroke="url(#shine)" stroke-opacity=".7" stroke-width="2"/>
</svg>
